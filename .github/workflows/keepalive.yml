name: Render Continuous Warm-Up & Keep Alive

on:
  schedule:
    # Runs every 5 minutes (GitHub minimum schedule interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Continuous 60s Keep-Alive Loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Loop (every 60s for 6 minutes)
        run: |
          echo "Starting continuous keep-alive loop to prevent Render spin-down..."
          for i in {1..6}; do
            echo "--- Ping $i at $(date -u) ---"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 25 "https://apexcorepro.onrender.com/api/health" || echo "000")
            echo "Response HTTP Status: $HTTP_CODE"
            if [ $i -lt 6 ]; then
              sleep 60
            fi
          done
          echo "Warm-up loop cycle completed."
